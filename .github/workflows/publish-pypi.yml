name: Publish Python package

# Manual only until PyPI trusted publishing is set up (docs/PYPI_SETUP.md): a tag trigger would fail on every
# release and mail the account owner. Add "push: tags: ['v*']" back after the first successful publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install build
      - run: npm ci
        working-directory: frontend
      - run: python tools/build_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist-py/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist-py/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py/
