name: Cross-platform CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      LOCALAPPDATA: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux libraries and CalculiX
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1 calculix-ccx
      - name: macOS CalculiX
        id: calculix
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install costerwi/calculix/calculix-ccx
      - name: Report optional CalculiX install
        if: runner.os == 'macOS' && steps.calculix.outcome == 'failure'
        run: echo '::warning::Homebrew CalculiX unavailable; built-in FEM and discovery tests still run.'
      - run: python -m pip install -e ".[dev]"
      - name: Add-ons in the package folder, as a build places them
        run: python -c "import shutil; shutil.copytree('integrations', 'backend/novastudio/integrations', dirs_exist_ok=True)"
      - run: python -m pytest backend/tests -q
      - run: npm ci
        working-directory: frontend
      - run: python tools/build_wheel.py
      - run: python tools/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-dist-${{ matrix.os }}
          path: dist-py/

  # Every change re-solves the structural and thermal reference problems; the table goes on the run page.
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOCALAPPDATA: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1 calculix-ccx
      - run: python -m pip install -e ".[dev]"
      - name: Solve the reference problems
        run: python validation/suite.py --quick --out validation/results/ci.json
      - name: Publish the table
        if: always()
        run: |
          last=$(ls validation/results/[0-9]*.json | sort -V | tail -1)
          python validation/ci_summary.py validation/results/ci.json --compare "$last" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-results
          path: validation/results/ci.json
